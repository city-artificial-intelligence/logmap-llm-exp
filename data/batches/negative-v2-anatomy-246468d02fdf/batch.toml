[conditions.plain-v2-k0.config.few_shot]
few_shot_k = 0

[conditions.plain-sib-k2.config.few_shot]
few_shot_k = 2
rag_negative_layout = "paired-sibling-v2"

[conditions.plain-sib-k2.config.prompts]
sibling_strategy = "sapbert"
sibling_model = "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
sibling_model_revision = "090663c3ae57bf35ffe4d0d468a2a88d03051a4d"
sibling_max_candidates = 512
sibling_encoder_device = "cpu"

[conditions.plain-sib-k4.config.few_shot]
few_shot_k = 4
rag_negative_layout = "paired-sibling-v2"

[conditions.plain-sib-k4.config.prompts]
sibling_strategy = "sapbert"
sibling_model = "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
sibling_model_revision = "090663c3ae57bf35ffe4d0d468a2a88d03051a4d"
sibling_max_candidates = 512
sibling_encoder_device = "cpu"

[conditions.plain-pdn-k2.config.few_shot]
