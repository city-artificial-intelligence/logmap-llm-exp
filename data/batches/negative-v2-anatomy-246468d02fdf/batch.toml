rag_negative_layout = "paired-donor-v2"

[conditions.plain-pdn-k4.config.few_shot]
few_shot_k = 4
rag_negative_layout = "paired-donor-v2"

[matrix]
tasks = [
    "anatomy",
]
models = [
    "deepseek-v4-flash-gmicloud-fp8-off",
    "gemini-2-5-flash-off",
    "mistral-small-3-2-24b",
    "qwen3-235b",
    "qwen3-5-122b",
    "llama-3-1-70b",
    "gemma-3-27b",
    "qwen3-8b",
]
conditions = [
    "plain-v2-k0",
    "plain-sib-k2",
    "plain-sib-k4",
    "plain-pdn-k2",
    "plain-pdn-k4",
]
repeats = 1

[aggregate]
group_by = [
    "model",
    "condition",
]
require_complete = true
