[alignmentTask]
generate_extended_mappings_to_ask_oracle = false
logmap_jvm_memory = "12g"
logmap_parameters_dirpath = "/home/jon/tools/logmap/paired-control-class-only/src/target"
onto_source_filepath = "/home/jon/data/oaei-2025-anatomy/mouse.owl"
onto_target_filepath = "/home/jon/data/oaei-2025-anatomy/human.owl"
ontology_domain = "biomedical anatomy"
ontology_vocabulary = "default"
stub_import_iris = []
task_name = "anatomy"

[evaluation]
evaluate = true
force_custom_eval = true
jvm_memory = "8g"
metrics = [
    "global",
    "oracle",
]
partial_reference = false
reference_alignment_path = "/home/jon/canonical_projects_folder/logmap-llm-exp/campaign/references/anatomy/reference.tsv"
stratified_by_entity_type = false
stratified_class_property = false

[few_shot]
few_shot_k = 4
few_shot_negative_strategy = "query-rag"
few_shot_seed = 0
rag_cache_dir = "/home/jon/data/logmap-llm-rag-runtime/cache"
rag_encoder_device = "cpu"
rag_encoder_kind = "sapbert"
rag_encoder_max_length = 64
rag_encoder_model = "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
rag_encoder_revision = "090663c3ae57bf35ffe4d0d468a2a88d03051a4d"
rag_failure_policy = "error"
rag_negative_layout = "paired-sibling-v2"

[oracle]
answer_format = "true_false"
api_key = "ENV:OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
connect_timeout_seconds = 15.0
enable_thinking = false
interaction_style = "openrouter"
local_oracle_predictions_dirpath = ""
max_completion_tokens = 2056
max_workers = 8
model_name = "mistralai/mistral-small-3.2-24b-instruct"
openrouter_allow_fallbacks = false
openrouter_provider = "deepinfra/fp8"
openrouter_require_parameters = true
request_logprobs = false
request_timeout_seconds = 300.0
response_mode = "plain"
seed = 0
temperature = 0.0
top_p = 1.0
transient_retries = 2

[outputs]
logmap_initial_alignment_output_dirpath = "/home/jon/canonical_projects_folder/logmap-llm-exp/batches/negative-v2-anatomy-246468d02fdf/jobs/anatomy-mistral-small-3-2-24b-plain-sib-k4-r0-1b55374b/standalone/logmap-initial-alignment"
logmap_refined_alignment_output_dirpath = "/home/jon/canonical_projects_folder/logmap-llm-exp/batches/negative-v2-anatomy-246468d02fdf/jobs/anatomy-mistral-small-3-2-24b-plain-sib-k4-r0-1b55374b/standalone/logmap-refined-alignment"
logmapllm_output_dirpath = "/home/jon/canonical_projects_folder/logmap-llm-exp/batches/negative-v2-anatomy-246468d02fdf/jobs/anatomy-mistral-small-3-2-24b-plain-sib-k4-r0-1b55374b/standalone/logmapllm-outputs"

[pipeline]
