schema = 1

[batch]
name = "plain-true-false-recovery-deepseek-gmicloud-knowledge-graph"
output_root = "../../../../batches"
jobs = 2
timeout_seconds = 86400
reuse_alignments = true

[defaults.alignmentTask]
generate_extended_mappings_to_ask_oracle = false
logmap_parameters_dirpath = "/home/jon/tools/logmap/kg-abox/src/target"
logmap_jvm_memory = "16g"
ontology_domain = "knowledge graphs"
ontology_vocabulary = "dbpedia_family"

[defaults.oracle]
max_workers = 8
enable_thinking = false
max_completion_tokens = 2056
request_timeout_seconds = 300.0
connect_timeout_seconds = 15.0
transient_retries = 2
seed = 0
request_logprobs = true
temperature = 0.0
top_p = 1.0
answer_format = "true_false"
response_mode = "plain"

[defaults.prompts]
cls_dev_prompt_template_name = "class_equivalence"
cls_usr_prompt_template_name = "one_level_of_parents_and_synonyms"
prop_dev_prompt_template_name = "property_equivalence"
prop_usr_prompt_template_name = "prop_domain_range"
dprop_usr_prompt_template_name = "prop_domain_range"
inst_dev_prompt_template_name = "instance_equivalence"
inst_usr_prompt_template_name = "inst_full_context_entropy"

[defaults.pipeline]
align_ontologies = "align"
build_oracle_prompts = "build"
consult_oracle = "consult"
refine_alignment = "refine"
refinement_strategy = "python"

[defaults.evaluation]
evaluate = true
metrics = [
    "global",
    "oracle",
]
force_custom_eval = true
partial_reference = true
stratified_by_entity_type = true
jvm_memory = "8g"

[defaults.few_shot]
few_shot_k = 4
few_shot_seed = 0
few_shot_negative_strategy = "query-rag"
rag_encoder_kind = "sapbert"
rag_encoder_model = "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
rag_encoder_revision = "090663c3ae57bf35ffe4d0d468a2a88d03051a4d"
rag_encoder_device = "cpu"
rag_failure_policy = "error"
rag_cache_dir = "/home/jon/data/logmap-llm-rag-runtime/cache"
rag_encoder_max_length = 64

[tasks.marvelcinematicuniverse-marvel.config.alignmentTask]
task_name = "marvelcinematicuniverse-marvel"
onto_source_filepath = "/home/jon/data/oaei-2025-knowledge-graph-v4/objects/marvelcinematicuniverse.rdf"
onto_target_filepath = "/home/jon/data/oaei-2025-knowledge-graph-v4/objects/marvel.rdf"

[tasks.marvelcinematicuniverse-marvel.config.evaluation]
reference_alignment_path = "../../../references/knowledge-graph/marvelcinematicuniverse-marvel/reference_all.tsv"

[tasks.memoryalpha-memorybeta.config.alignmentTask]
task_name = "memoryalpha-memorybeta"
onto_source_filepath = "/home/jon/data/oaei-2025-knowledge-graph-v4/objects/memoryalpha.rdf"
onto_target_filepath = "/home/jon/data/oaei-2025-knowledge-graph-v4/objects/memorybeta.rdf"

[tasks.memoryalpha-memorybeta.config.evaluation]
reference_alignment_path = "../../../references/knowledge-graph/memoryalpha-memorybeta/reference_all.tsv"

[tasks.memoryalpha-stexpanded.config.alignmentTask]
task_name = "memoryalpha-stexpanded"
onto_source_filepath = "/home/jon/data/oaei-2025-knowledge-graph-v4/objects/memoryalpha.rdf"
onto_target_filepath = "/home/jon/data/oaei-2025-knowledge-graph-v4/objects/stexpanded.rdf"

[tasks.memoryalpha-stexpanded.config.evaluation]
reference_alignment_path = "../../../references/knowledge-graph/memoryalpha-stexpanded/reference_all.tsv"

[tasks.starwars-swg.config.alignmentTask]
task_name = "starwars-swg"
onto_source_filepath = "/home/jon/data/oaei-2025-knowledge-graph-v4/objects/starwars.rdf"
onto_target_filepath = "/home/jon/data/oaei-2025-knowledge-graph-v4/objects/swg.rdf"

[tasks.starwars-swg.config.evaluation]
reference_alignment_path = "../../../references/knowledge-graph/starwars-swg/reference_all.tsv"

[tasks.starwars-swtor.config.alignmentTask]
task_name = "starwars-swtor"
onto_source_filepath = "/home/jon/data/oaei-2025-knowledge-graph-v4/objects/starwars.rdf"
onto_target_filepath = "/home/jon/data/oaei-2025-knowledge-graph-v4/objects/swtor.rdf"

[tasks.starwars-swtor.config.evaluation]
reference_alignment_path = "../../../references/knowledge-graph/starwars-swtor/reference_all.tsv"

[models.deepseek-v4-flash-gmicloud-fp8-off]
max_parallel_runs = 1
verify_endpoint = true

[models.deepseek-v4-flash-gmicloud-fp8-off.config.oracle]
model_name = "deepseek/deepseek-v4-flash"
max_workers = 1
base_url = "https://openrouter.ai/api/v1"
api_key = "ENV:OPENROUTER_API_KEY"
interaction_style = "openrouter"
reasoning_effort = "none"
request_logprobs = false
openrouter_provider = "gmicloud/fp8"
openrouter_allow_fallbacks = false
openrouter_require_parameters = true

[conditions.plain-k0.config.few_shot]
few_shot_k = 0

[conditions.plain-k2.config.few_shot]
few_shot_k = 2
rag_encoder_kind = "sbert"
rag_encoder_model = "sentence-transformers/all-MiniLM-L12-v2"
rag_encoder_revision = "a50ef00143b4d5391434df20ae11632588ac25be"
rag_encoder_max_length = 128

[conditions.plain-k4.config.few_shot]
few_shot_k = 4
rag_encoder_kind = "sbert"
rag_encoder_model = "sentence-transformers/all-MiniLM-L12-v2"
rag_encoder_revision = "a50ef00143b4d5391434df20ae11632588ac25be"
rag_encoder_max_length = 128

[matrix]
tasks = [
    "marvelcinematicuniverse-marvel",
    "memoryalpha-memorybeta",
    "memoryalpha-stexpanded",
    "starwars-swg",
    "starwars-swtor",
]
models = [
    "deepseek-v4-flash-gmicloud-fp8-off",
]
conditions = [
    "plain-k0",
    "plain-k2",
    "plain-k4",
]
repeats = 1

[aggregate]
group_by = [
    "model",
    "condition",
]
require_complete = true
