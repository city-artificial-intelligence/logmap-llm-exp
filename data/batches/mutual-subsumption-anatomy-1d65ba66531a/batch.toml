schema = 1

[batch]
name = "mutual-subsumption-anatomy"
output_root = "../../../batches"
jobs = 2
timeout_seconds = 86400
reuse_alignments = true

[defaults.alignmentTask]
generate_extended_mappings_to_ask_oracle = false
logmap_parameters_dirpath = "/home/jon/tools/logmap/paired-control-class-only/src/target"
logmap_jvm_memory = "12g"
ontology_domain = "biomedical anatomy"
ontology_vocabulary = "default"

[defaults.oracle]
max_workers = 8
enable_thinking = false
max_completion_tokens = 2056
request_timeout_seconds = 300.0
connect_timeout_seconds = 15.0
transient_retries = 2
seed = 0
request_logprobs = true
temperature = 0.0
top_p = 1.0
answer_format = "true_false"
response_mode = "plain"

[defaults.prompts]
cls_dev_prompt_template_name = "class_equivalence"
cls_usr_prompt_template_name = "one_level_of_parents_and_synonyms"
prop_dev_prompt_template_name = "property_equivalence"
prop_usr_prompt_template_name = "prop_domain_range"
dprop_usr_prompt_template_name = "prop_domain_range"
inst_dev_prompt_template_name = "instance_equivalence"
inst_usr_prompt_template_name = "inst_full_context_entropy"

[defaults.pipeline]
align_ontologies = "align"
build_oracle_prompts = "build"
consult_oracle = "consult"
refine_alignment = "refine"
refinement_strategy = "logmap"

[defaults.evaluation]
evaluate = true
metrics = [
    "global",
    "oracle",
]
force_custom_eval = true
jvm_memory = "8g"

[defaults.few_shot]
few_shot_k = 4
few_shot_seed = 0
few_shot_negative_strategy = "query-rag"
rag_encoder_kind = "sapbert"
rag_encoder_model = "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
rag_encoder_revision = "090663c3ae57bf35ffe4d0d468a2a88d03051a4d"
rag_encoder_device = "cpu"
rag_failure_policy = "error"
rag_cache_dir = "/home/jon/data/logmap-llm-rag-runtime/cache"
rag_encoder_max_length = 64

[tasks.anatomy.config.alignmentTask]
task_name = "anatomy"
onto_source_filepath = "/home/jon/data/oaei-2025-anatomy/mouse.owl"
onto_target_filepath = "/home/jon/data/oaei-2025-anatomy/human.owl"

[tasks.anatomy.config.evaluation]
reference_alignment_path = "../../references/anatomy/reference.tsv"

[models.qwen3-5-122b]
max_parallel_runs = 1
verify_endpoint = true

[models.qwen3-5-122b.config.oracle]
model_name = "Qwen3.5-122B-A10B"
base_url = "http://127.0.0.1:18011/v1"
api_key = "EMPTY"
interaction_style = "vllm"
supports_chat_template_kwargs = true

[models.llama-3-1-70b]
max_parallel_runs = 1
verify_endpoint = true

[models.llama-3-1-70b.config.oracle]
model_name = "Llama-3.1-70B-Instruct"
base_url = "http://127.0.0.1:18010/v1"
api_key = "EMPTY"
interaction_style = "vllm"
supports_chat_template_kwargs = false

[models.gemma-3-27b]
max_parallel_runs = 1
verify_endpoint = true

[models.gemma-3-27b.config.oracle]
model_name = "Gemma-3-27B"
base_url = "http://127.0.0.1:18004/v1"
api_key = "EMPTY"
interaction_style = "vllm"
supports_chat_template_kwargs = false

[models.qwen3-8b]
max_parallel_runs = 1
verify_endpoint = true

[models.qwen3-8b.config.oracle]
model_name = "Qwen3-8B"
base_url = "http://127.0.0.1:18001/v1"
api_key = "EMPTY"
interaction_style = "vllm"
supports_chat_template_kwargs = true

[conditions.bidir-k0.config.few_shot]
few_shot_k = 0

[conditions.bidir-k0.config.prompts]
cls_usr_prompt_template_name = "sub_parents_synonyms"
cls_dev_prompt_template_name = "class_subsumption_mod"

[matrix]
tasks = [
    "anatomy",
]
models = [
    "gemma-3-27b",
    "qwen3-8b",
    "llama-3-1-70b",
    "qwen3-5-122b",
]
conditions = [
    "bidir-k0",
]
repeats = 1

[aggregate]
group_by = [
    "model",
    "condition",
]
require_complete = true
