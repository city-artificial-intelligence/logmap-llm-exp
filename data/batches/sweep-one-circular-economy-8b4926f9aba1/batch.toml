[matrix]
tasks = ["ce-ce", "ce-mat"]
models = ["plain-logmap", "deepseek-v4-flash", "gemini-2-5-flash", "mistral-small-3-2-24b", "qwen3-235b", "qwen3-5-122b", "llama-3-1-70b", "gemma-3-27b", "qwen3-8b"]
conditions = ["zero-shot"]
repeats = 1
exclude = []

[aggregate]
group_by = ["model"]
require_complete = true
