schema = 1

[batch]
name = "sweep-one-circular-economy"
output_root = "../../batches"
jobs = 2
timeout_seconds = 86400
reuse_alignments = true

[defaults.alignmentTask]
generate_extended_mappings_to_ask_oracle = false
stub_import_iris = [
  "http://w3id.org/CEON/ontology/actor/0.4/",
  "http://w3id.org/CEON/ontology/actorODP/0.4/",
  "http://w3id.org/CEON/ontology/cvn/0.3/",
  "http://w3id.org/CEON/ontology/energy/0.2/",
  "http://w3id.org/CEON/ontology/location/0.2/",
  "http://w3id.org/CEON/ontology/material/0.4/",
  "http://w3id.org/CEON/ontology/process/0.5/",
  "http://w3id.org/CEON/ontology/product/0.5/",
  "http://w3id.org/CEON/ontology/quantity/0.2/",
  "http://w3id.org/CEON/ontology/statement/0.2/",
  "http://w3id.org/CEON/ontology/value/0.3/",
]
logmap_parameters_dirpath = "/home/jon/tools/logmap/paired-control/src/target"
logmap_jvm_memory = "12g"
ontology_domain = "circular economy"
ontology_vocabulary = "default"

[defaults.oracle]
max_workers = 8
enable_thinking = false
max_completion_tokens = 64
request_timeout_seconds = 300.0
connect_timeout_seconds = 15.0
transient_retries = 2
seed = 0
request_logprobs = true
temperature = 0.0
top_p = 1.0
answer_format = "true_false"
response_mode = "structured"

[defaults.prompts]
cls_dev_prompt_template_name = "class_equivalence"
cls_usr_prompt_template_name = "one_level_of_parents_and_synonyms"
prop_dev_prompt_template_name = "property_equivalence"
prop_usr_prompt_template_name = "prop_domain_range"
dprop_usr_prompt_template_name = "prop_domain_range"
inst_dev_prompt_template_name = "instance_equivalence"
inst_usr_prompt_template_name = "inst_full_context_entropy"

[defaults.pipeline]
align_ontologies = "align"
build_oracle_prompts = "build"
consult_oracle = "consult"
refine_alignment = "refine"
refinement_strategy = "logmap"

[defaults.evaluation]
evaluate = true
metrics = ["global", "oracle"]
force_custom_eval = true
stratified_class_property = true
jvm_memory = "8g"

[tasks.ce-ce.config.alignmentTask]
task_name = "ce-ce"
onto_source_filepath = "/home/jon/data/oaei-2025-ce-v2/ce-ce/CEON.rdf"
onto_target_filepath = "/home/jon/data/oaei-2025-ce-v2/ce-ce/BiOnto.rdf"
[tasks.ce-ce.config.evaluation]
reference_alignment_path = "../references/circular-economy/ce-ce/reference.tsv"

[tasks.ce-mat.config.alignmentTask]
task_name = "ce-mat"
onto_source_filepath = "/home/jon/data/oaei-2025-ce-v2/ce-mat/CEON.rdf"
onto_target_filepath = "/home/jon/data/oaei-2025-ce-v2/ce-mat/MATONTO.rdf"
[tasks.ce-mat.config.evaluation]
reference_alignment_path = "../references/circular-economy/ce-mat/reference.tsv"

[models.plain-logmap]
max_parallel_runs = 1
verify_endpoint = false
[models.plain-logmap.config.oracle]
model_name = "plain-logmap"
base_url = "http://127.0.0.1:1/v1"
api_key = "EMPTY"
interaction_style = "local"
request_logprobs = false
[models.plain-logmap.config.pipeline]
build_oracle_prompts = "bypass"
consult_oracle = "bypass"
[models.plain-logmap.config.evaluation]
metrics = ["global"]

[models.deepseek-v4-flash]
max_parallel_runs = 1
verify_endpoint = true
[models.deepseek-v4-flash.config.oracle]
model_name = "deepseek/deepseek-v4-flash"
max_workers = 1
base_url = "https://openrouter.ai/api/v1"
api_key = "ENV:OPENROUTER_API_KEY"
interaction_style = "openrouter"
reasoning_effort = "none"
request_logprobs = false
openrouter_provider = "wandb/fp8"
openrouter_allow_fallbacks = false
openrouter_require_parameters = true

[models.gemini-2-5-flash]
max_parallel_runs = 1
verify_endpoint = true
[models.gemini-2-5-flash.config.oracle]
