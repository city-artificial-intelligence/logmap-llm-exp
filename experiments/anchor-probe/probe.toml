# Anchor-probe experiment. Paths are relative to this file; job configs are the archived k0/zero-shot-current
# configs, copied verbatim, so ontologies / reference / outputs / endpoints are exactly the ones those jobs used.
# Run from the repo root:  PYTHONPATH=src python -m logmap_llm.anchor_probe check experiments/anchor-probe/probe.toml

output_root = "runs"

# Optional prefix rewrites applied to every path inside the job configs (use when running off the original machine).
[path_map]
# Not needed on the machine the job configs came from. Elsewhere, uncomment and point at local copies, e.g.:
# "/home/jon/data/oaei-2025-anatomy" = "/data/anatomy/human-mouse"
# "/home/jon/data/oaei-2025-bio-ml/omim-ordo/omim-ordo" = "/data/bio-ml/omim-ordo"

[tasks.anatomy]
probe_sets = [
  "pairs/anatomy/v4-100.tsv",
  "pairs/anatomy/v4-200.tsv",
  "pairs/anatomy/v5-g-150.tsv",
  "pairs/anatomy/v5-mix-150.tsv",
]
# Folder holding <task>-logmap_anchors.tsv, -logmap_hard_discarded_mappings.txt, -logmap_mappings_to_ask_oracle_user_llm.txt.
# Only `build` needs it. Default: the logmap-initial-alignment dir of the first job below. The frozen probe sets
# in pairs/ were built from the collective-anchors alignment-sources export of these same LogMap runs.
logmap_dir = ""

[[tasks.anatomy.jobs]]
config = "jobs/anatomy/anatomy-deepseek-v4-flash-parasail-off-zero-shot-current-r0-6a92a599.toml"

[[tasks.anatomy.jobs]]
config = "jobs/anatomy/anatomy-gemini-2-5-flash-off-zero-shot-current-r0-76231eb1.toml"

