<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogMapLLM Oracle — Cost/Benefit Explorer</title>
    <meta
      name="description"
      content="Interactive explorer for the LogMapLLM LLM-oracle cost/benefit analysis: cost-quality Pareto frontier, oracle value, and model leaderboard."
    />
    <!-- social cards; og:url / og:image / canonical need an absolute URL, so add
         them once the deploy host is fixed (the site builds host-agnostic, base: './') -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LogMapLLM Oracle" />
    <meta property="og:title" content="LogMapLLM Oracle — Cost/Benefit Explorer" />
    <meta
      property="og:description"
      content="Interactive explorer for the LogMapLLM LLM-oracle cost/benefit analysis: cost-quality Pareto frontier, oracle value, and model leaderboard."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LogMapLLM Oracle — Cost/Benefit Explorer" />
    <meta
      name="twitter:description"
      content="Interactive explorer for the LogMapLLM LLM-oracle cost/benefit analysis: cost-quality Pareto frontier, oracle value, and model leaderboard."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235e6ad2'/%3E%3Ccircle cx='12' cy='20' r='4' fill='%23fff'/%3E%3Ccircle cx='21' cy='11' r='3' fill='%23fff' fill-opacity='.75'/%3E%3C/svg%3E"
    />
    <!-- Safari ignores SVG favicons; it (and home-screen pins) use this PNG -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      // stamp the persisted (or OS) theme before first paint so dark-mode users
      // never see a light flash; App keeps it in sync afterwards
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem('theme');
          dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
          try { dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e2) { /* light */ }
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0e0e11' : '#fafafa');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
